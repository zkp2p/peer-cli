name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'releases/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and check image
        run: docker build -f deploy/Dockerfile -t peer-mcp:ci .
      - name: Check MCP health
        run: |
          docker run --detach --name peer-mcp-ci --network host peer-mcp:ci
          trap 'docker logs peer-mcp-ci; docker rm --force peer-mcp-ci >/dev/null' EXIT
          status="$(curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 1 --retry-max-time 60 \
            --connect-timeout 2 --max-time 5 \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/health)"
          test "$status" = 200
